services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: stylesync_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: stylesync_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build: 
      context: ./backend
    container_name: stylesync_backend
    command: bash -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MINIO_URL=${MINIO_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - ML_SERVICE_URL=${ML_SERVICE_URL}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - postgres
      - minio
      - ml_service
    volumes:
      - ./backend:/app

  ml_service:
    build:
      context: ./ml_service
    container_name: stylesync_ml_service
    ports:
      - "8001:8001"
    volumes:
      - ./ml_service:/app
    # Need sufficient shared memory for PyTorch if doing multiprocessing, optional but good practice
    shm_size: '2gb'

  frontend:
    build:
      context: ./frontend
    container_name: stylesync_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  minio_data:
